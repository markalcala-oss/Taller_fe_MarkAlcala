<section id="contacto" class="contacto-section">
  <div class="contacto-copy">
    <p class="eyebrow">Contacto</p>
    <h2>Reserva tu experiencia perfecta.</h2>
    <p>
      Estamos listos para ayudarte a planear una estancia inolvidable. Escríbenos y te
      responderemos a la brevedad.
    </p>
    <ul>
      <li>📍 Calle del Sol 254, Valle Grande</li>
      <li>📞 +51 987 654 321</li>
      <li>✉️ hola@vallegrandehotel.com</li>
    </ul>
  </div>

  <form class="contacto-form">
    <div class="field-group">
      <label for="nombre">Nombre</label>
      <input id="nombre" type="text" placeholder="Tu nombre" />
    </div>

    <div class="field-group">
      <label for="correo">Correo</label>
      <input id="correo" type="email" placeholder="tucorreo@email.com" />
    </div>

    <div class="field-group">
      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" rows="5" placeholder="Cuéntanos tus fechas y preferencias..."></textarea>
    </div>

    <button type="submit">Enviar solicitud</button>
  </form>
</section>
